<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà cung cấp | Quản Lý Tạp Hóa</title>
    <link rel="stylesheet" href="../css/supplier.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo"></span>
                <span class="sidebar-title">Quản Lý Tạp Hóa</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">Menu chính</div>
                <a href="dashboard.html" class="nav-item"><span
                        class="nav-item-icon"></span><span>Dashboard</span></a>
                <a href="sales.html" class="nav-item"><span class="nav-item-icon"></span><span>Bán hàng</span></a>
                <a href="products.html" class="nav-item"><span class="nav-item-icon"></span><span>Sản phẩm</span></a>
                <a href="invoices.html" class="nav-item"><span class="nav-item-icon"></span><span>Hóa đơn</span></a>
                <div class="nav-section-title">Quản lý</div>
                <a href="inventory.html" class="nav-item"><span class="nav-item-icon"></span><span>Kho hàng</span></a>
                <a href="customers.html" class="nav-item"><span class="nav-item-icon"></span><span>Khách
                        hàng</span></a>
                <a href="suppliers.html" class="nav-item active"><span class="nav-item-icon"></span><span>Nhà cung
                        cấp</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="logoutBtn"><span class="nav-item-icon"></span><span>Đăng
                        xuất</span></a>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="menu-toggle">☰</button>
                    <h1 class="header-title">Quản lý nhà cung cấp</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" id="addSupplierBtn">+ Thêm NCC</button>
                </div>
            </header>

            <div class="page-content">
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Tên nhà cung cấp</th>
                                    <th>Số điện thoại</th>
                                    <th>Địa chỉ</th>
                                    <th>Người liên hệ</th>
                                    <th class="text-right">Công nợ</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="suppliersTableBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted p-6">Đang tải...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let suppliers = [];
        let editingId = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!Auth.requireAuth()) return;
            loadSuppliers();
            document.getElementById('addSupplierBtn').addEventListener('click', () => openModal());
        });

        async function loadSuppliers() {
            try {
                const response = await API.suppliers.getAll();
                if (response.status === 'success') {
                    suppliers = response.data;
                    renderSuppliers();
                }
            } catch (error) {
                console.error('Failed to load suppliers:', error);
            }
        }

        function renderSuppliers() {
            const tbody = document.getElementById('suppliersTableBody');
            if (suppliers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted p-6">Không có nhà cung cấp</td></tr>';
                return;
            }
            tbody.innerHTML = suppliers.map(s => `
                <tr>
                    <td><strong>${s.name}</strong>${s.email ? `<br><small class="text-muted">${s.email}</small>` : ''}</td>
                    <td>${s.phone || '-'}</td>
                    <td>${s.address || '-'}</td>
                    <td>${s.contact_person || '-'}</td>
                    <td class="text-right">0 ₫</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline" onclick="editSupplier(${s.id})">Sửa</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteSupplier(${s.id})">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(supplier = null) {
            editingId = supplier ? supplier.id : null;
            const html = `
                <div class="modal-overlay active" id="supplierModal">
                    <div class="modal">
                        <div class="modal-header">
                            <h3 class="modal-title">${supplier ? 'Sửa' : 'Thêm'} nhà cung cấp</h3>
                            <button class="modal-close" onclick="closeModal()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label>Tên nhà cung cấp *</label>
                                <input type="text" class="form-input" id="supplierName" value="${supplier?.name || ''}" required>
                            </div>
                            <div class="form-group">
                                <label>Số điện thoại</label>
                                <input type="text" class="form-input" id="supplierPhone" value="${supplier?.phone || ''}">
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" class="form-input" id="supplierEmail" value="${supplier?.email || ''}">
                            </div>
                            <div class="form-group">
                                <label>Địa chỉ</label>
                                <input type="text" class="form-input" id="supplierAddress" value="${supplier?.address || ''}">
                            </div>
                            <div class="form-group">
                                <label>Người liên hệ</label>
                                <input type="text" class="form-input" id="supplierContact" value="${supplier?.contact_person || ''}">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                            <button class="btn btn-primary" onclick="saveSupplier()">Lưu</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function closeModal() {
            const modal = document.getElementById('supplierModal');
            if (modal) modal.remove();
            editingId = null;
        }

        async function saveSupplier() {
            const data = {
                name: document.getElementById('supplierName').value,
                phone: document.getElementById('supplierPhone').value,
                email: document.getElementById('supplierEmail').value,
                address: document.getElementById('supplierAddress').value,
                contactPerson: document.getElementById('supplierContact').value
            };
            if (!data.name) { Utils.showToast('Vui lòng nhập tên', 'warning'); return; }
            try {
                if (editingId) {
                    await API.suppliers.update(editingId, data);
                    Utils.showToast('Cập nhật thành công', 'success');
                } else {
                    await API.suppliers.create(data);
                    Utils.showToast('Thêm thành công', 'success');
                }
                closeModal();
                loadSuppliers();
            } catch (error) {
                Utils.showToast(error.message, 'error');
            }
        }

        async function editSupplier(id) {
            const supplier = suppliers.find(s => s.id === id);
            if (supplier) openModal(supplier);
        }

        async function deleteSupplier(id) {
            if (confirm('Bạn có chắc muốn xóa nhà cung cấp này?')) {
                try {
                    await API.suppliers.delete(id);
                    Utils.showToast('Xóa thành công', 'success');
                    loadSuppliers();
                } catch (error) {
                    Utils.showToast(error.message, 'error');
                }
            }
        }
    </script>
</body>

</html>
