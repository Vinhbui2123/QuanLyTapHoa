<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khách hàng | Quản Lý Tạp Hóa</title>
    <link rel="stylesheet" href="../css/customers.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo icon icon-store" aria-hidden="true"></span>
                <div>
                    <span class="sidebar-title">Quản Lý Tạp Hóa</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">Menu chính</div>
                <a href="dashboard.html" class="nav-item"><span
                        class="nav-item-icon icon icon-dashboard" aria-hidden="true"></span><span>Tổng Quan</span></a>
                <a href="sales.html" class="nav-item"><span class="nav-item-icon icon icon-sales"
                        aria-hidden="true"></span><span>Bán hàng</span></a>
                <a href="products.html" class="nav-item"><span class="nav-item-icon icon icon-products"
                        aria-hidden="true"></span><span>Sản phẩm</span></a>
                <a href="invoices.html" class="nav-item"><span class="nav-item-icon icon icon-invoices"
                        aria-hidden="true"></span><span>Hóa đơn</span></a>
                <div class="nav-section-title">Quản lý</div>
                <a href="inventory.html" class="nav-item"><span class="nav-item-icon icon icon-inventory"
                        aria-hidden="true"></span><span>Kho hàng</span></a>
                <a href="customers.html" class="nav-item active"><span class="nav-item-icon icon icon-customers"
                        aria-hidden="true"></span><span>Khách
                        hàng</span></a>
                <a href="suppliers.html" class="nav-item"><span class="nav-item-icon icon icon-suppliers"
                        aria-hidden="true"></span><span>Nhà cung
                        cấp</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="logoutBtn"><span class="nav-item-icon icon icon-logout"
                        aria-hidden="true"></span><span>Đăng
                        xuất</span></a>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="menu-toggle" aria-label="Mở menu"><span class="icon icon-menu"
                            aria-hidden="true"></span></button>
                    <h1 class="header-title">Quản lý khách hàng</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" id="addCustomerBtn">+ Thêm khách hàng</button>
                </div>
            </header>

            <div class="page-content">
                <div class="card">
                    <div class="products-toolbar">
                        <div class="search-box">
                            <span class="search-box-icon icon icon-search" aria-hidden="true"></span>
                            <input type="text" class="form-input" placeholder="Tìm khách hàng..." id="searchInput">
                        </div>
                    </div>

                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Tên khách hàng</th>
                                    <th>Số điện thoại</th>
                                    <th>Địa chỉ</th>
                                    <th>Loại KH</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="customersTableBody">
                                <tr>
                                    <td colspan="5" class="text-center text-muted p-6">Đang tải...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let customers = [];
        let editingId = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!Auth.requireAuth()) return;
            loadCustomers();

            document.getElementById('addCustomerBtn').addEventListener('click', () => openModal());
            document.getElementById('searchInput').addEventListener('input', debounce(loadCustomers, 300));
        });

        async function loadCustomers() {
            try {
                const search = document.getElementById('searchInput').value;
                const response = await API.customers.getAll({ search });
                if (response.status === 'success') {
                    customers = response.data;
                    renderCustomers();
                }
            } catch (error) {
                console.error('Failed to load customers:', error);
            }
        }

        function renderCustomers() {
            const tbody = document.getElementById('customersTableBody');
            if (customers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted p-6">Không có khách hàng</td></tr>';
                return;
            }
            tbody.innerHTML = customers.map(c => `
                <tr>
                    <td><strong>${c.name}</strong></td>
                    <td>${c.phone || '-'}</td>
                    <td>${c.address || '-'}</td>
                    <td><span class="badge badge-${c.customer_type === 'vip' ? 'success' : 'secondary'}">${getCustomerTypeLabel(c.customer_type)}</span></td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline" onclick="editCustomer(${c.id})">Sửa</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${c.id})">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        function getCustomerTypeLabel(type) {
            const labels = { regular: 'Thường', vip: 'VIP', wholesale: 'Sỉ', debt: 'Công nợ' };
            return labels[type] || type;
        }

        function openModal(customer = null) {
            editingId = customer ? customer.id : null;
            const html = `
                <div class="modal-overlay active" id="customerModal">
                    <div class="modal">
                        <div class="modal-header">
                            <h3 class="modal-title">${customer ? 'Sửa' : 'Thêm'} khách hàng</h3>
                            <button class="modal-close" onclick="closeModal()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label>Tên khách hàng *</label>
                                <input type="text" class="form-input" id="customerName" value="${customer?.name || ''}" required>
                            </div>
                            <div class="form-group">
                                <label>Số điện thoại</label>
                                <input type="text" class="form-input" id="customerPhone" value="${customer?.phone || ''}">
                            </div>
                            <div class="form-group">
                                <label>Địa chỉ</label>
                                <input type="text" class="form-input" id="customerAddress" value="${customer?.address || ''}">
                            </div>
                            <div class="form-group">
                                <label>Loại khách hàng</label>
                                <select class="form-select" id="customerType">
                                    <option value="regular" ${customer?.customer_type === 'regular' ? 'selected' : ''}>Thường</option>
                                    <option value="vip" ${customer?.customer_type === 'vip' ? 'selected' : ''}>VIP</option>
                                    <option value="wholesale" ${customer?.customer_type === 'wholesale' ? 'selected' : ''}>Khách sỉ</option>
                                    <option value="debt" ${customer?.customer_type === 'debt' ? 'selected' : ''}>Công nợ</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                            <button class="btn btn-primary" onclick="saveCustomer()">Lưu</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function closeModal() {
            const modal = document.getElementById('customerModal');
            if (modal) modal.remove();
            editingId = null;
        }

        async function saveCustomer() {
            const data = {
                name: document.getElementById('customerName').value,
                phone: document.getElementById('customerPhone').value,
                address: document.getElementById('customerAddress').value,
                customerType: document.getElementById('customerType').value
            };
            if (!data.name) { Utils.showToast('Vui lòng nhập tên', 'warning'); return; }
            try {
                if (editingId) {
                    await API.customers.update(editingId, data);
                    Utils.showToast('Cập nhật thành công', 'success');
                } else {
                    await API.customers.create(data);
                    Utils.showToast('Thêm thành công', 'success');
                }
                closeModal();
                loadCustomers();
            } catch (error) {
                Utils.showToast(error.message, 'error');
            }
        }

        async function editCustomer(id) {
            const customer = customers.find(c => c.id === id);
            if (customer) openModal(customer);
        }

        async function deleteCustomer(id) {
            if (confirm('Bạn có chắc muốn xóa khách hàng này?')) {
                try {
                    await API.customers.delete(id);
                    Utils.showToast('Xóa thành công', 'success');
                    loadCustomers();
                } catch (error) {
                    Utils.showToast(error.message, 'error');
                }
            }
        }

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
</body>

</html>
