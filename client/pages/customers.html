<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khách hàng | Quản Lý Tạp Hóa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/customers.css">
    <style>
        
    </style>
</head>
<body>
     <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">🏪</span>
                <span class="sidebar-title">Quản Lý Tạp Hóa</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">Menu chính</div>
                <a href="dashboard.html" class="nav-item"><span
                        class="nav-item-icon">📊</span><span>Dashboard</span></a>
                <a href="sales.html" class="nav-item"><span class="nav-item-icon">🛒</span><span>Bán hàng</span></a>
                <a href="products.html" class="nav-item"><span class="nav-item-icon">📦</span><span>Sản phẩm</span></a>
                <a href="invoices.html" class="nav-item"><span class="nav-item-icon">🧾</span><span>Hóa đơn</span></a>
                <div class="nav-section-title">Quản lý</div>
                <a href="inventory.html" class="nav-item"><span class="nav-item-icon">🏭</span><span>Kho hàng</span></a>
                <a href="customers.html" class="nav-item active"><span class="nav-item-icon">👥</span><span>Khách hàng</span></a>
                <a href="supplier.html" class="nav-item"><span class="nav-item-icon">🚚</span><span>Nhà cung cấp</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="logoutBtn"><span class="nav-item-icon">🚪</span><span>Đăng
                        xuất</span></a>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="menu-toggle">☰</button>
                    <h1 class="header-title">Quản lý khách hàng</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" id="addCustomerBtn"> Thêm khách hàng</button>
                </div>
            </header>

            <div class="page-content">
                <div class="card">
                    <div class="products-toolbar">
                        <div class="search-box">
                            <span class="search-box-icon">🔍</span>
                            <input type="text" class="form-input" placeholder="Tìm khách hàng..." id="searchInput">
                        </div>
                    </div>

                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Tên khách hàng</th>
                                    <th>Số điện thoại</th>
                                    <th>Địa chỉ</th>
                                    <th>Loại KH</th>
                                    <th class="text-right">Công nợ</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="customersTableBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted p-6">Đang tải...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>    
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
