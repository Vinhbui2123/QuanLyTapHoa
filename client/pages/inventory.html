
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho hàng | Quản Lý Tạp Hóa</title>
    <link rel="stylesheet" href="../css/inventory.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">Logo</span>
                <span class="sidebar-title">Quản Lý Tạp Hóa</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">Menu chính</div>
                <a href="dashboard.html" class="nav-item"><span
                        class="nav-item-icon"></span><span>Dashboard</span></a>
                <a href="sales.html" class="nav-item"><span class="nav-item-icon"></span><span>Bán hàng</span></a>
                <a href="products.html" class="nav-item"><span class="nav-item-icon"></span><span>Sản phẩm</span></a>
                <a href="invoices.html" class="nav-item"><span class="nav-item-icon"></span><span>Hóa đơn</span></a>
                <div class="nav-section-title">Quản lý</div>
                <a href="inventory.html" class="nav-item active"><span class="nav-item-icon"></span><span>Kho
                        hàng</span></a>
                <a href="customers.html" class="nav-item"><span class="nav-item-icon"></span><span>Khách
                        hàng</span></a>
                <a href="supplier.html" class="nav-item"><span class="nav-item-icon"></span><span>Nhà cung
                        cấp</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="logoutBtn" ><span class="nav-item-icon" ></span><span>Đăng xuất</span></a>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="menu-toggle">☰</button>
                    <h1 class="header-title">Quản lý kho hàng</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" id="importBtn" >+ Nhập kho</button>
                </div>
            </header>

            <div class="page-content">
                <!-- Alerts -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-label">Hàng sắp hết</span>
                            <div class="stat-card-icon" style="background: rgba(245,158,11,0.1);"></div>
                        </div>
                        <div class="stat-card-value" id="lowStockCount" >0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-label">Hàng sắp hết hạn (30 ngày)</span>
                            <div class="stat-card-icon" style="background: rgba(239,68,68,0.1);"></div>
                        </div>
                        <div class="stat-card-value" id="expiringCount">0</div>
                    </div>
                </div>

                <!-- Inventory Table -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Tồn kho</h2>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Sản phẩm</th>
                                    <th class="text-center">Tồn kho</th>
                                    <th class="text-center">Ngưỡng</th>
                                    <th class="text-center">Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody id="inventoryTableBody">
                                <tr>
                                    <td colspan="4" class="text-center text-muted p-6">Đang tải...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script>
         let inventory = [];
        let products = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (!Auth.requireAuth()) return;
            loadInventory();
            loadProducts();
            document.getElementById('importBtn').addEventListener('click', openImportModal);
        });

        async function loadInventory() {
            try {
                const response = await API.inventory.getAll();
                if (response.status === 'success') {
                    inventory = response.data;
                    renderInventory();
                    updateStats();
                }
            } catch (error) {
                console.error('Failed to load inventory:', error);
            }
        }

        async function loadProducts() {
            try {
                const response = await API.products.getAll();
                if (response.status === 'success') {
                    products = response.data;
                }
            } catch (error) {
                console.error('Failed to load products:', error);
            }
        }

        function renderInventory() {
            const tbody = document.getElementById('inventoryTableBody');
            if (inventory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted p-6">Không có sản phẩm</td></tr>';
                return;
            }
            tbody.innerHTML = inventory.map(i => `
                <tr>
                    <td><strong>${i.name}</strong>${i.barcode ? `<br><small class="text-muted">${i.barcode}</small>` : ''}</td>
                    <td class="text-center">${i.stock_quantity} ${i.unit || ''}</td>
                    <td class="text-center">${i.min_stock}</td>
                    <td class="text-center">
                        ${i.stock_quantity <= i.min_stock
                    ? '<span class="badge badge-warning">⚠️ Sắp hết</span>'
                    : '<span class="badge badge-success">✓ Còn hàng</span>'}
                    </td>
                </tr>
            `).join('');
        }

        async function updateStats() {
            const lowStock = inventory.filter(i => i.stock_quantity <= i.min_stock).length;
            document.getElementById('lowStockCount').textContent = lowStock;
            try {
                const res = await API.reports.getDashboard();
                if (res.status === 'success') {
                    document.getElementById('expiringCount').textContent = res.data.expiringCount || 0;
                }
            } catch (e) {
                document.getElementById('expiringCount').textContent = '0';
            }
        }

        function openImportModal() {
            const productOptions = products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            const html = `
                <div class="modal-overlay active" id="importModal">
                    <div class="modal" style="max-width: 600px;">
                        <div class="modal-header">
                            <h3 class="modal-title">Nhập kho</h3>
                            <button class="modal-close" onclick="closeModal()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div id="importItems">
                                <div class="import-item mb-3" style="display:flex;gap:12px;align-items:end;">
                                    <div class="form-group" style="flex:2;margin:0">
                                        <label>Sản phẩm</label>
                                        <select class="form-select import-product">${productOptions}</select>
                                    </div>
                                    <div class="form-group" style="flex:1;margin:0">
                                        <label>Số lượng</label>
                                        <input type="number" class="form-input import-qty" min="1" value="1">
                                    </div>
                                    <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Xóa</button>
                                </div>
                            </div>
                            <button class="btn btn-outline btn-sm" onclick="addImportRow()">+ Thêm sản phẩm</button>
                            <div class="form-group mt-4">
                                <label>Ghi chú</label>
                                <input type="text" class="form-input" id="importNote" placeholder="Ghi chú nhập kho">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                            <button class="btn btn-primary" onclick="submitImport()">Nhập kho</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function addImportRow() {
            const productOptions = products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            const row = `
                <div class="import-item mb-3" style="display:flex;gap:12px;align-items:end;">
                    <div class="form-group" style="flex:2;margin:0">
                        <label>Sản phẩm</label>
                        <select class="form-select import-product">${productOptions}</select>
                    </div>
                    <div class="form-group" style="flex:1;margin:0">
                        <label>Số lượng</label>
                        <input type="number" class="form-input import-qty" min="1" value="1">
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Xóa</button>
                </div>
            `;
            document.getElementById('importItems').insertAdjacentHTML('beforeend', row);
        }

        function closeModal() {
            const modal = document.getElementById('importModal');
            if (modal) modal.remove();
        }

        async function submitImport() {
            const items = [];
            document.querySelectorAll('.import-item').forEach(el => {
                const productId = parseInt(el.querySelector('.import-product').value);
                const quantity = parseInt(el.querySelector('.import-qty').value);
                if (productId && quantity > 0) {
                    items.push({ productId, quantity });
                }
            });

            if (items.length === 0) {
                Utils.showToast('Vui lòng thêm sản phẩm', 'warning');
                return;
            }

            try {
                const response = await API.inventory.import({
                    items,
                    note: document.getElementById('importNote').value
                });
                if (response.status === 'success') {
                    Utils.showToast('Nhập kho thành công', 'success');
                    closeModal();
                    loadInventory();
                }
            } catch (error) {
                Utils.showToast(error.message, 'error');
            }
        }
    </script>
</body>

</html>
