<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quản lý sản phẩm - Quản Lý Tạp Hóa">
    <title>Sản phẩm | Quản Lý Tạp Hóa</title>

    <link rel="stylesheet" href="../css/products.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">🏪</span>
                <span class="sidebar-title">Quản Lý Tạp Hóa</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">Menu chính</div>
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-item-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="sales.html" class="nav-item">
                    <span class="nav-item-icon">🛒</span>
                    <span>Bán hàng</span>
                </a>
                <a href="products.html" class="nav-item active">
                    <span class="nav-item-icon">📦</span>
                    <span>Sản phẩm</span>
                </a> 
                <a href="invoices.html" class="nav-item">
                    <span class="nav-item-icon">🧾</span>
                    <span>Hóa đơn</span>
                </a>

                <div class="nav-section-title">Quản lý</div>
                <a href="inventory.html" class="nav-item">
                    <span class="nav-item-icon">🏭</span>
                    <span>Kho hàng</span>
                </a>
                <a href="customers.html" class="nav-item">
                    <span class="nav-item-icon">👥</span>
                    <span>Khách hàng</span>
                </a>
                <a href="supplier.html" class="nav-item">
                    <span class="nav-item-icon">🚚</span>
                    <span>Nhà cung cấp</span>
                </a>

                <div class="nav-section-title">Báo cáo</div>
                <a href="report.html" class="nav-item">
                    <span class="nav-item-icon">📈</span>
                    <span>Báo cáo</span>    
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="nav-item-icon">🚪</span>
                    <span>Đăng xuất</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="menu-toggle">☰</button>
                    <h1 class="header-title">Quản lý sản phẩm</h1>
                </div>
                <div class="header-right">
                    <div class="header-user">
                        <div class="header-user-avatar">A</div>
                        <span class="header-user-name">Admin</span>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div class="products-toolbar">
                    <div class="products-filters">
                        <div class="search-box">
                            <span class="search-box-icon"></span>
                            <input type="text" class="form-input" placeholder="Tìm sản phẩm..." id="searchInput">
                        </div>
                        <select class="form-select" id="categoryFilter" style="width: 200px;">
                            <option value="">Tất cả danh mục</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="addProductBtn">
                        + Thêm sản phẩm
                    </button>
                </div>
                <div class="card">
                    <div class="table-container">
                        <table class="table" id="productsTable">
                            <thead>
                                <tr>
                                    <th>Tên sản phẩm</th>
                                    <th>Danh mục</th>
                                    <th class="text-right">Giá bán</th>
                                    <th class="text-center">Tồn kho</th>
                                    <th class="text-center">Trạng thái</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="productsTableBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted p-6">
                                        Đang tải dữ liệu...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination" id="pagination">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Thêm sản phẩm</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">

                    <div class="form-group">
                        <label for="productName">Tên sản phẩm *</label>
                        <input type="text" class="form-input" id="productName" required>
                    </div>

                    <div class="form-group">
                        <label for="productBarcode">Mã vạch</label>
                        <input type="text" class="form-input" id="productBarcode">
                    </div>

                    <div class="form-group">
                        <label for="productCategory">Danh mục</label>
                        <select class="form-select" id="productCategory">
                            <option value="">-- Chọn danh mục --</option>
                        </select>
                    </div>

                    <div class="flex gap-4">
                        <div class="form-group" style="flex:1">
                            <label for="productCostPrice">Giá nhập</label>
                            <input type="number" class="form-input" id="productCostPrice" min="0">
                        </div>
                        <div class="form-group" style="flex:1">
                            <label for="productSalePrice">Giá bán *</label>
                            <input type="number" class="form-input" id="productSalePrice" min="0" required>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <div class="form-group" style="flex:1">
                            <label for="productUnit">Đơn vị</label>
                            <input type="text" class="form-input" id="productUnit" value="cái">
                        </div>
                        <div class="form-group" style="flex:1">
                            <label for="productMinStock">Ngưỡng cảnh báo</label>
                            <input type="number" class="form-input" id="productMinStock" value="10" min="0">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">Hủy</button>
                <button class="btn btn-primary" id="saveBtn">Lưu</button>
            </div>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth()) return;

            loadProducts();
            loadCategories();

            document.getElementById('addProductBtn').addEventListener('click', () => openModal());
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('searchInput').addEventListener('input', debounce(loadProducts, 300));
            document.getElementById('categoryFilter').addEventListener('change', loadProducts);
            document.getElementById('saveBtn').addEventListener('click', async () => {
                if (document.getElementById('productForm').reportValidity()) {
                    await saveProduct();
                }
            });
        });

        async function loadProducts() {
            try { 
                const search = document.getElementById('searchInput').value;
                const category = document.getElementById('categoryFilter').value;
                const response = await API.products.getAll({ search, category });
            
                if (response.status === "success" || response.data) {
                    const data = response.data.data ? response.data.data : response.data;
                    renderProducts(data);
                }
            } catch (error) {
                console.log('Failed to load products: ', error);
            }
        }

        async function loadCategories() {
            try {
                const response = await API.categories.getAll();
                if (response.status === "success" || response.data) {
                    const data = response.data.data ? response.data.data : response.data;
                    const select = document.getElementById('categoryFilter');
                    const modalSelect = document.getElementById('productCategory');

                    data.forEach(cat => {
                        select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
                        modalSelect.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
                    });
                }
            } catch (error) {
                console.log('Failed to load categories: ', error);
            }
        }

        function renderProducts(products) {
            const tbody = document.getElementById('productsTableBody');
            if (!products || products.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-muted p-6">
                            Không có sản phẩm nào
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>
                        <strong>${p.name}</strong>
                        ${p.barcode ? `<br><small class="text-muted">${p.barcode}</small>` : ''}
                    </td>
                    <td>${p.category_name || p.category || '-'}</td>
                    <td class="text-right">${window.Utils ? Utils.formatCurrency(p.sale_price) : p.sale_price}</td>
                    <td class="text-center">${p.stock_quantity !== undefined ? p.stock_quantity : (p.stock || 0)} ${p.unit || ''}</td>
                    <td class="text-center">
                        ${(p.stock_quantity !== undefined ? p.stock_quantity : (p.stock || 0)) <= (p.min_stock || 10)
                    ? '<span class="badge badge-warning">Sắp hết</span>'
                    : '<span class="badge badge-success">Còn hàng</span>'}
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline" onclick="editProduct(${p.id})">Sửa</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(product = null) {
            const modal = document.getElementById('productModal');
            const title = document.getElementById('modalTitle');

            if (product) {
                title.textContent = 'Sửa sản phẩm';
                document.getElementById('productId').value = product.id;
                document.getElementById('productName').value = product.name || '';
                document.getElementById('productBarcode').value = product.barcode || '';
                document.getElementById('productCategory').value = product.category_id || '';
                document.getElementById('productCostPrice').value = product.cost_price || '';
                document.getElementById('productSalePrice').value = product.sale_price || '';
                document.getElementById('productUnit').value = product.unit || 'cái';
                document.getElementById('productMinStock').value = product.min_stock || 10;
            } else {
                title.textContent = 'Thêm sản phẩm';
                document.getElementById('productForm').reset();
                document.getElementById('productId').value = '';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        async function editProduct(id) {
            try {
                const response = await API.products.getById(id);
                if (response.status === "success" || response.data) {
                    const data = response.data || response;
                    openModal(data);
                }
            } catch (error) {
                console.log('Failed to load product: ', error);
                if (window.Utils && Utils.showToast) {
                    Utils.showToast('Không thể tải thông tin sản phẩm', 'error');
                }
            }
        }

        async function saveProduct() {
            try {
                const id = document.getElementById('productId').value;
                const data = {
                    name: document.getElementById('productName').value,
                    barcode: document.getElementById('productBarcode').value,
                    categoryId: document.getElementById('productCategory').value || null,
                    costPrice: document.getElementById('productCostPrice').value ? Number(document.getElementById('productCostPrice').value) : null,
                    salePrice: Number(document.getElementById('productSalePrice').value),
                    unit: document.getElementById('productUnit').value || 'cái',
                    minStock: Number(document.getElementById('productMinStock').value) || 10
                };

                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = true;
                saveBtn.textContent = 'Đang xử lý...';

                if (id) {
                    await API.products.update(id, data);
                    if (window.Utils && Utils.showToast) Utils.showToast('Cập nhật sản phẩm thành công', 'success');
                } else {
                    await API.products.create(data);
                    if (window.Utils && Utils.showToast) Utils.showToast('Thêm sản phẩm thành công', 'success');
                }

                closeModal();
                loadProducts();
            } catch (error) {
                console.log('Failed to save product: ', error);
                if (window.Utils && Utils.showToast) Utils.showToast(error.message || 'Có lỗi xảy ra', 'error');
            } finally {
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = false;
                saveBtn.textContent = 'Lưu';
            }
        }

        async function deleteProduct(id) {
            if (window.Utils && Utils.confirmDialog && Utils.confirmDialog('Bạn có chắc muốn xóa sản phẩm này?')) {
                try {
                    await API.products.delete(id);
                    Utils.showToast('Xóa sản phẩm thành công', 'success');
                    loadProducts();
                } catch (error) {
                    Utils.showToast(error.message || 'Có lỗi xảy ra', 'error');
                }
            }
        }

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
</body>

</html>
