<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quản lý sản phẩm - Quản Lý Tạp Hóa" />
    <title>Sản phẩm | Quản Lý Tạp Hóa</title>

    <link rel="stylesheet" href="../css/products.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-logo icon icon-store" aria-hidden="true"></span>
          <div>
            <span class="sidebar-title">Quản Lý Tạp Hóa</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section-title">Menu chính</div>
          <a href="dashboard.html" class="nav-item">
            <span class="nav-item-icon icon icon-dashboard" aria-hidden="true"></span>
            <span>Tổng Quan</span>
          </a>
          <a href="sales.html" class="nav-item">
            <span class="nav-item-icon icon icon-sales" aria-hidden="true"></span>
            <span>Bán hàng</span>
          </a>
          <a href="products.html" class="nav-item active">
            <span class="nav-item-icon icon icon-products" aria-hidden="true"></span>
            <span>Sản phẩm</span>
          </a>
          <a href="invoices.html" class="nav-item">
            <span class="nav-item-icon icon icon-invoices" aria-hidden="true"></span>
            <span>Hóa đơn</span>
          </a>

          <div class="nav-section-title">Quản lý</div>
          <a href="inventory.html" class="nav-item">
            <span class="nav-item-icon icon icon-inventory" aria-hidden="true"></span>
            <span>Kho hàng</span>
          </a>
          <a href="customers.html" class="nav-item">
            <span class="nav-item-icon icon icon-customers" aria-hidden="true"></span>
            <span>Khách hàng</span>
          </a>
          <a href="suppliers.html" class="nav-item">
            <span class="nav-item-icon icon icon-suppliers" aria-hidden="true"></span>
            <span>Nhà cung cấp</span>
          </a>

          <div class="nav-section-title">Báo cáo</div>
          <a href="reports.html" class="nav-item">
            <span class="nav-item-icon icon icon-reports" aria-hidden="true"></span>
            <span>Báo cáo</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <a href="#" class="nav-item" id="logoutBtn">
            <span class="nav-item-icon icon icon-logout" aria-hidden="true"></span>
            <span>Đăng xuất</span>
          </a>
        </div>
      </aside>

      <main class="main-content">
        <header class="main-header">
          <div class="header-left">
            <button class="menu-toggle" aria-label="Mở menu"><span class="icon icon-menu" aria-hidden="true"></span></button>
            <h1 class="header-title">Quản lý sản phẩm</h1>
          </div>
          <div class="header-right">
            <div class="header-user">
              <div class="header-user-avatar">A</div>
              <span class="header-user-name">Admin</span>
            </div>
          </div>
        </header>

        <div class="page-content">
          <div class="products-toolbar">
            <div class="products-filters">
              <div class="search-box">
                <span class="search-box-icon icon icon-search" aria-hidden="true"></span>
                <input
                  type="text"
                  class="form-input"
                  placeholder="Tìm sản phẩm..."
                  id="searchInput"
                />
              </div>
              <select
                class="form-select"
                id="categoryFilter"
                style="width: 200px"
              >
                <option value="">Tất cả danh mục</option>
                <!-- Dynamic categories -->
              </select>
            </div>
            <button class="btn btn-primary" id="addProductBtn">
              Thêm sản phẩm
            </button>
          </div>

          <div class="card">
            <div class="table-container">
              <table class="table" id="productsTable">
                <thead>
                  <tr>
                    <th>Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th class="text-right">Giá bán</th>
                    <th class="text-center">Tồn kho</th>
                    <th class="text-center">Trạng thái</th>
                    <th class="text-center">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="productsTableBody">
                  <!-- Dynamic content -->
                  <tr>
                    <td colspan="6" class="text-center text-muted p-6">
                      Đang tải dữ liệu...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
              <!-- Dynamic pagination -->
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Thêm/Sửa sản phẩm -->
    <div class="modal-overlay" id="productModal">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title" id="modalTitle">Thêm sản phẩm</h3>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <div class="modal-body">
          <form id="productForm">
            <input type="hidden" id="productId" />

            <div class="form-group">
              <label for="productName">Tên sản phẩm *</label>
              <input type="text" class="form-input" id="productName" required />
            </div>

            <div class="form-group">
              <label for="productBarcode">Mã vạch</label>
              <input type="text" class="form-input" id="productBarcode" />
            </div>

            <div class="form-group">
              <label for="productCategory">Danh mục</label>
              <select class="form-select" id="productCategory">
                <option value="">-- Chọn danh mục --</option>
              </select>
            </div>

            <div class="flex gap-4">
              <div class="form-group" style="flex: 1">
                <label for="productCostPrice">Giá nhập</label>
                <input
                  type="number"
                  class="form-input"
                  id="productCostPrice"
                  min="0"
                />
              </div>
              <div class="form-group" style="flex: 1">
                <label for="productSalePrice">Giá bán *</label>
                <input
                  type="number"
                  class="form-input"
                  id="productSalePrice"
                  min="0"
                  required
                />
              </div>
            </div>

            <div class="flex gap-4">
              <div class="form-group" style="flex: 1">
                <label for="productUnit">Đơn vị</label>
                <input
                  type="text"
                  class="form-input"
                  id="productUnit"
                  value="cái"
                />
              </div>
              <div class="form-group" style="flex: 1">
                <label for="productMinStock">Ngưỡng cảnh báo</label>
                <input
                  type="number"
                  class="form-input"
                  id="productMinStock"
                  value="10"
                  min="0"
                />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelBtn">Hủy</button>
          <button class="btn btn-primary" id="saveBtn">Lưu</button>
        </div>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script>
      // Products page logic

      let editingProductId = null;
      let currentPage = 1;
      const pageSize = 10;
      let totalPages = 1;

      document.addEventListener("DOMContentLoaded", async () => {
        if (!Auth.requireAuth()) return;

        loadProducts();
        loadCategories();

        document
          .getElementById("addProductBtn")
          .addEventListener("click", () => {
            openModal();
          });

        document
          .getElementById("closeModal")
          .addEventListener("click", closeModal);
        document
          .getElementById("cancelBtn")
          .addEventListener("click", closeModal);
        document
          .getElementById("saveBtn")
          .addEventListener("click", saveProduct);

        document
          .getElementById("searchInput")
          .addEventListener("input", debounce(() => loadProducts(1), 300));
        document
          .getElementById("categoryFilter")
          .addEventListener("change", () => loadProducts(1));
      });

      async function loadProducts(page = currentPage) {
        try {
          currentPage = page;
          const search = document.getElementById("searchInput").value;
          const category = document.getElementById("categoryFilter").value;

          const response = await API.products.getAll({
            search,
            category,
            page: currentPage,
            limit: pageSize,
          });

          if (response.status === "success") {
            const meta = response.meta || {};
            totalPages = Math.max(meta.totalPages || 1, 1);

            if ((response.data || []).length === 0 && currentPage > totalPages) {
              await loadProducts(totalPages);
              return;
            }

            renderProducts(response.data);
            renderPagination(meta);
          }
        } catch (error) {
          console.error("Failed to load products:", error);
        }
      }

      async function loadCategories() {
        try {
          const response = await API.categories.getAll();
          if (response.status === "success") {
            const select = document.getElementById("categoryFilter");
            const modalSelect = document.getElementById("productCategory");

            response.data.forEach((cat) => {
              select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
              modalSelect.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
          }
        } catch (error) {
          console.error("Failed to load categories:", error);
        }
      }

      function renderProducts(products) {
        const tbody = document.getElementById("productsTableBody");

        if (products.length === 0) {
          tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-muted p-6">
                            Không có sản phẩm nào
                        </td>
                    </tr>
                `;
          return;
        }

        tbody.innerHTML = products
          .map(
            (p) => `
                <tr>
                    <td>
                        <strong>${p.name}</strong>
                        ${p.barcode ? `<br><small class="text-muted">${p.barcode}</small>` : ""}
                    </td>
                    <td>${p.category_name || "-"}</td>
                    <td class="text-right">${Utils.formatCurrency(p.sale_price)}</td>
                    <td class="text-center">${p.stock_quantity} ${p.unit || ""}</td>
                    <td class="text-center">
                        ${
                          p.stock_quantity <= p.min_stock
                            ? '<span class="badge badge-warning">Sắp hết</span>'
                            : '<span class="badge badge-success">Còn hàng</span>'
                        }
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline" onclick="editProduct(${p.id})">Sửa</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Xóa</button>
                    </td>
                </tr>
            `,
          )
          .join("");
      }

      function renderPagination(meta = {}) {
        const pagination = document.getElementById("pagination");
        const page = meta.page || currentPage;
        const total = meta.total || 0;
        const pages = Math.max(meta.totalPages || totalPages || 1, 1);

        if (total === 0) {
          pagination.innerHTML = "";
          return;
        }

        const buttons = [];
        const startPage = Math.max(1, page - 1);
        const endPage = Math.min(pages, startPage + 2);

        for (let i = startPage; i <= endPage; i++) {
          buttons.push(`
            <button class="btn btn-sm ${i === page ? "btn-primary" : "btn-outline"}" onclick="goToPage(${i})">
              ${i}
            </button>
          `);
        }

        pagination.innerHTML = `
          <span class="text-muted text-sm">Trang ${page}/${pages} • ${total} sản phẩm</span>
          <div class="flex gap-2">
            <button class="btn btn-sm btn-outline" onclick="goToPage(${page - 1})" ${page <= 1 ? "disabled" : ""}>
              Trước
            </button>
            ${buttons.join("")}
            <button class="btn btn-sm btn-outline" onclick="goToPage(${page + 1})" ${page >= pages ? "disabled" : ""}>
              Sau
            </button>
          </div>
        `;
      }

      function goToPage(page) {
        if (page < 1 || page > totalPages || page === currentPage) {
          return;
        }

        loadProducts(page);
      }

      function openModal(product = null) {
        const modal = document.getElementById("productModal");
        const title = document.getElementById("modalTitle");

        if (product) {
          title.textContent = "Sửa sản phẩm";
          editingProductId = product.id;
          document.getElementById("productId").value = product.id;
          document.getElementById("productName").value = product.name || "";
          document.getElementById("productBarcode").value =
            product.barcode || "";
          document.getElementById("productCategory").value =
            product.category_id || "";
          document.getElementById("productCostPrice").value =
            product.cost_price || 0;
          document.getElementById("productSalePrice").value =
            product.sale_price || 0;
          document.getElementById("productUnit").value = product.unit || "cái";
          document.getElementById("productMinStock").value =
            product.min_stock || 10;
        } else {
          title.textContent = "Thêm sản phẩm";
          editingProductId = null;
          document.getElementById("productForm").reset();
          document.getElementById("productUnit").value = "cái";
          document.getElementById("productMinStock").value = "10";
        }

        modal.classList.add("active");
      }

      function closeModal() {
        document.getElementById("productModal").classList.remove("active");
        editingProductId = null;
      }

      async function editProduct(id) {
        try {
          const response = await API.products.getById(id);
          if (response.status === "success") {
            openModal(response.data);
          }
        } catch (error) {
          Utils.showToast("Không thể tải thông tin sản phẩm", "error");
        }
      }

      async function saveProduct() {
        const name = document.getElementById("productName").value.trim();
        const salePrice = document.getElementById("productSalePrice").value;

        if (!name) {
          Utils.showToast("Vui lòng nhập tên sản phẩm", "warning");
          return;
        }
        if (!salePrice || parseFloat(salePrice) <= 0) {
          Utils.showToast("Vui lòng nhập giá bán hợp lệ", "warning");
          return;
        }

        const data = {
          name,
          barcode:
            document.getElementById("productBarcode").value.trim() || null,
          categoryId: document.getElementById("productCategory").value || null,
          costPrice:
            parseFloat(document.getElementById("productCostPrice").value) || 0,
          salePrice: parseFloat(salePrice),
          unit: document.getElementById("productUnit").value.trim() || "cái",
          minStock:
            parseInt(document.getElementById("productMinStock").value) || 10,
        };

        try {
          if (editingProductId) {
            await API.products.update(editingProductId, data);
            Utils.showToast("Cập nhật sản phẩm thành công", "success");
          } else {
            await API.products.create(data);
            Utils.showToast("Thêm sản phẩm thành công", "success");
          }
          closeModal();
          loadProducts(currentPage);
        } catch (error) {
          Utils.showToast(error.message, "error");
        }
      }

      async function deleteProduct(id) {
        if (Utils.confirmDialog("Bạn có chắc muốn xóa sản phẩm này?")) {
          try {
            await API.products.delete(id);
            Utils.showToast("Xóa sản phẩm thành công", "success");
            loadProducts(currentPage);
          } catch (error) {
            Utils.showToast(error.message, "error");
          }
        }
      }

      function debounce(func, wait) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), wait);
        };
      }
    </script>
  </body>
</html>
